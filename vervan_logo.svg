<?xml version="1.0" encoding="UTF-8"?>
<!-- Vervan Chat horizontal lockup. White-backed export for docs, store listings, and marketing. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 440" width="1500" height="440" role="img" aria-labelledby="title desc">
  <title id="title">Vervan Chat logo</title>
  <desc id="desc">A bold amber-to-periwinkle V monogram with a small AI spark, followed by the Vervan Chat wordmark.</desc>
  <defs>
    <linearGradient id="mark" x1="85" y1="90" x2="345" y2="350" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F6B24E"/>
      <stop offset="52%" stop-color="#ECA56A"/>
      <stop offset="100%" stop-color="#7C9AFF"/>
    </linearGradient>
    <linearGradient id="spark" x1="260" y1="258" x2="332" y2="330" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFE1B0"/>
      <stop offset="100%" stop-color="#F6B24E"/>
    </linearGradient>
  </defs>

  <rect width="1500" height="440" rx="48" fill="#FFFFFF"/>

  <g transform="translate(58 32)">
    <rect width="376" height="376" rx="92" fill="#171A26"/>
    <path d="M102,90 C124,77 149,84 163,108 L188,154 L213,108 C227,84 252,77 274,90 C295,102 300,127 287,149 L220,270 C210,288 197,298 188,298 C179,298 166,288 156,270 L89,149 C76,127 81,102 102,90 Z" fill="url(#mark)"/>
    <circle cx="229" cy="235" r="30" fill="#171A26" opacity="0.20"/>
    <circle cx="229" cy="235" r="24" fill="url(#spark)"/>
    <path d="M302,50 L334,82 L302,114 L270,82 Z" fill="#FFE1B0" opacity="0.94"/>
  </g>

  <g fill="#171A26" transform="translate(510 0)">
    <text x="0" y="240" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="142" font-weight="750" letter-spacing="-5">Vervan</text>
    <text x="9" y="316" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="32" font-weight="700" letter-spacing="8" fill="#65708D">CHAT / LOCAL AI WORKSPACE</text>
  </g>
</svg>

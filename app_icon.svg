<?xml version="1.0" encoding="UTF-8"?>
<!--
  Vervan Chat — master app icon source (1024x1024).

  The mark is a bold, filled V that stays legible at launcher size. Its two converging ribbons
  suggest a private workspace bringing conversations, notes, sources, and tools together; the
  amber node and twinkle make the on-device AI cue explicit. The palette matches the app's Aurora
  theme: amber #F6B24E and periwinkle #7C9AFF on indigo ink.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <radialGradient id="bg" cx="38%" cy="32%" r="85%">
      <stop offset="0%" stop-color="#2A2A33"/>
      <stop offset="100%" stop-color="#131318"/>
    </radialGradient>
    <linearGradient id="mark" x1="300" y1="330" x2="706" y2="690" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F6B24E"/>
      <stop offset="52%" stop-color="#ECA56A"/>
      <stop offset="100%" stop-color="#7C9AFF"/>
    </linearGradient>
    <linearGradient id="spark" x1="572" y1="560" x2="672" y2="660" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFE1B0"/>
      <stop offset="100%" stop-color="#F6B24E"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1024" height="1024" rx="190" fill="url(#bg)"/>

  <!-- Filled V monogram: a softer, more ownable silhouette than a generic outline chevron. -->
  <path d="M314,330
           C343,313 376,322 394,353
           L512,566
           L630,353
           C648,322 681,313 710,330
           C737,346 744,378 728,405
           L578,674
           C564,699 540,713 512,713
           C484,713 460,699 446,674
           L296,405
           C280,378 287,346 314,330 Z"
        fill="url(#mark)"/>

  <!-- AI spark node: the local-intelligence signal sits inside the V's right rhythm. -->
  <circle cx="630" cy="606" r="48" fill="#131318" opacity="0.20"/>
  <circle cx="630" cy="606" r="39" fill="url(#spark)"/>

  <!-- Twinkle accent: restrained so the mark remains clean in monochrome. -->
  <path d="M738,248 L790,300 L738,352 L686,300 Z" fill="#FFE1B0" opacity="0.94"/>
</svg>
